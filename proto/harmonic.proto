syntax = "proto3";

import "google/protobuf/timestamp.proto";

package harmonic;

// Harmonic service for bidirectional file synchronization using delta encoding
service Harmonic {
  // Initiates a sync session by sending client state and receiving a sync plan
  rpc HarmonizeClientInitiateSync (ClientSyncState) returns (ServerSyncStateResponse);

  // Performs bidirectional streaming to transfer file deltas between client and server
  rpc HarmonizeSyncRequest (stream SyncRequest) returns (stream SyncRequest);
}

enum FileType {
  OTHER = 0;
  MARKDOWN = 1;
  PDF = 2;
}

enum FileChangeType {
  // ADDED is the zero value so legacy clients that do not populate
  // change_type are treated as uploading new content rather than deleting
  ADDED = 0;
  REMOVED = 1;
  MODIFIED = 2;
  UNCHANGED = 3;
}

enum TransferDirection {
  SKIP = 0;
  DOWNLOAD = 1;
  UPLOAD = 2;
  // Both sides delete the file locally if present. Idempotent.
  DELETE = 3;
}

message ClientSyncState {
  string sync_uuid = 1;
  int64 timestamp_last_sync_micro = 2;
  repeated FileStatus status_list = 3;
}

message FileStatus {
  string path = 1;
  google.protobuf.Timestamp timestamp = 2;
  FileType file_type = 3;
  bytes hash = 4;
  FileChangeType change_type = 5;
}

message ServerSyncStateResponse {
  string sync_uuid = 1;
  int64 timestamp_micro = 2;
  repeated FileAction sync_plan = 3;
}

message FileAction {
  string path = 1;
  TransferDirection direction = 2;
  google.protobuf.Timestamp timestamp_latest_modified = 3; 
}

message SyncRequest {
  oneof payload {
    FileAction file_action = 1;
    BlockSignatures signatures = 2;
    Delta delta = 3;
    bool complete = 4;
  }
}

message BlockSignatures {
  uint64 block_size = 1;
  repeated BlockSignature blocks = 2;
}

message BlockSignature {
  uint64 weak_checksum = 1;
  bytes strong_checksum = 2;
}

message Delta {
  uint64 index = 1;
  oneof instruction {
    uint32 block_index = 2;
    bytes literal = 3;
  }
}