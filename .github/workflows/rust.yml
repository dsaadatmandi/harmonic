name: Rust

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]


env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: harmonic
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: harmonic
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: harmonic
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: harmonic
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: harmonic.exe
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4

    - name: Install Protoc
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    
    - uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
        shared-key: ${{ matrix.target }}

    - name: Install mold linker
      if: matrix.os == 'ubuntu-latest' && matrix.target != 'aarch64-unknown-linux-gnu'
      run: |
        sudo apt-get update
        sudo apt-get install -y mold
        echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> $GITHUB_ENV

    - name: Install cross
      if: matrix.target == 'aarch64-unknown-linux-gnu'
      run: cargo install cross --locked
    
    - name: Build
      if: matrix.target != 'aarch64-unknown-linux-gnu'
      run: cargo build --release --target ${{ matrix.target }}

    - name: Build (cross)
      if: matrix.target == 'aarch64-unknown-linux-gnu'
      run: cross build --release --target ${{ matrix.target }}

    - name: Run tests
      if: matrix.target != 'aarch64-unknown-linux-gnu'
      run: cargo test --target ${{ matrix.target }}

    - name: Rename binaries (Windows)
      if: matrix.target == 'x86_64-pc-windows-msvc'
      run: |
        mkdir dist
        cp target/${{ matrix.target }}/release/harmonic-server.exe dist/harmonic-server-${{ matrix.target }}.exe
        cp target/${{ matrix.target }}/release/harmonic-client.exe dist/harmonic-client-${{ matrix.target }}.exe
      shell: pwsh

    - name: Rename binaries (Unix)
      if: matrix.target != 'x86_64-pc-windows-msvc'
      run: |
        mkdir -p dist
        cp target/${{ matrix.target }}/release/harmonic-server dist/harmonic-server-${{ matrix.target }}
        cp target/${{ matrix.target }}/release/harmonic-client dist/harmonic-client-${{ matrix.target }}

    - uses: actions/upload-artifact@v4
      with:
        name: harmonic-${{ matrix.target }}
        path: dist/*
            

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false