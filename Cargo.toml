[package]
name = "harmonic"
version = "0.5.0"
edition = "2024"

[features]
default = ["trace-stdout", "compression-zstd"]
trace-stdout = []
trace-jaeger = []
compression-zstd = []

[[bin]]
name = "harmonic-server"
path = "src/bin/server.rs"

[[bin]]
name = "harmonic-client"
path = "src/bin/client.rs"

[lib]
name = "harmonic"
path = "src/lib.rs"

[dependencies]
tonic = { version = "0.14.2", features = ["tls-ring", "zstd"] }
prost = "0.14.1"
tonic-prost = "0.14.2"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "sync", "fs"]} 
tokio-stream = { version = "0.1.17", features = ["net"] }
tokio-util = { version = "0.7", features = ["codec", "compat"] }
chrono = "0.4.42"
notify = "8.2.0"
futures = "0.3.31"
uuid = { "version" = "1.18.1", features = ["serde", "v4"] }
serde = { "version" = "1.0.228" , features = ["derive"] }
toml = "0.9.8"
walkdir = "2.5.0"
serde_json = "1.0.145"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
once_cell = "1.21.3"
blake3 = "1.8.2"
anyhow = "1.0.100"
thiserror = "2.0.17"
tracing = "0.1.41"
opentelemetry = "0.31.0"
tracing-opentelemetry = "0.32.0"
opentelemetry-http = "0.31.0"
tower = { version = "0.5.2", features = ["tokio", "tracing"] }
tower-http = { version = "0.6.6", features = ["trace"] }
tracing-serde = "0.2.0"
tracing-core = "0.1.34"
opentelemetry_sdk = "0.31.0"
opentelemetry-stdout = "0.31.0"
opentelemetry-otlp = "0.31.0"
path-clean = "1.0.1"
filetime = "0.2.26"
prost-types = "0.14.1"
rcgen = "0.14.5"
rustls = { version = "0.23.35", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rand = "0.9.2"
http = "1.4.0"
dirs = "6.0.0"
proptest = "1.9.0"
local-ip-address = "0.6.8"
clap = { version = "4.5", features = ["derive"] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
# zstd-sys defaults build x86-64 assembly and require libclang for bindings,
# neither of which exist on aarch64 cross builds
zstd-sys = { version = "2.0.13", default-features = false, features = ["legacy", "zdict_builder", "no_asm"] }

[dev-dependencies]
tempfile = "3.23.0"
criterion = { version = "0.8.1", features = ["html_reports"] }
rollsum = "0.3.0"
adler = "1.0.2"
bytes = "1.10.1"
http-body = "1.0.1"
http-body-util = "0.1.3"

[[bench]]
name = "hash_benchmark"
harness = false

[build-dependencies]
tonic-prost-build = "0.14.2"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
